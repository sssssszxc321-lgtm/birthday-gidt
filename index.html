<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Подарок 🎁</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="matrix"></div>


<main class="gift-page">


    <!-- ПЕРВЫЙ ЭКРАН -->

    <section
        id="startScreen"
        class="screen active"
    >

        <div class="stars">
            ✦ ✧ ✦ ✧ ✦
        </div>


        <p class="small-title">
            ДЛЯ ТЕБЯ ЕСТЬ ПОДАРОК
        </p>


        <div
            id="giftBox"
            class="gift-box"
        >

            <div class="box-lid"></div>


            <div class="box-body">

                <div class="ribbon vertical"></div>

                <div class="ribbon horizontal"></div>

            </div>


            <div class="bow">

                <span></span>

                <span></span>

            </div>

        </div>


        <h1 id="recipientPreview">
            Для тебя ❤️
        </h1>


        <p class="hint">
            Нажми на подарок
        </p>

    </section>



    <!-- ВТОРОЙ ЭКРАН -->

    <section
        id="cardScreen"
        class="screen"
    >

        <div class="card">


            <div class="card-top">

                <span>♡</span>

                <span>
                    С ДНЁМ РОЖДЕНИЯ
                </span>

                <span>♡</span>

            </div>


            <h1 id="title">
                С днём рождения!
            </h1>


            <div
                id="photoArea"
                class="photo-area"
            >

                <button
                    id="prevPhoto"
                    class="photo-button"
                >
                    ‹
                </button>


                <img
                    id="mainPhoto"
                    src=""
                    alt="Фото"
                >


                <button
                    id="nextPhoto"
                    class="photo-button"
                >
                    ›
                </button>

            </div>


            <div
                id="photoDots"
                class="photo-dots"
            ></div>


            <div
                id="message"
                class="message"
            ></div>


            <div class="hearts">
                ♥ ♥ ♥
            </div>


            <button
                id="musicButton"
                class="music-button"
            >
                ♫ Музыка
            </button>


        </div>


        <button
            id="againButton"
            class="again"
        >
            Открыть ещё раз
        </button>


    </section>

</main>


<audio
    id="music"
    loop
></audio>



<script>


/* =========================
   ПОЛУЧАЕМ ДАННЫЕ ИЗ ССЫЛКИ
   ========================= */

const params =
    new URLSearchParams(
        window.location.search
    );


let data = null;


/*
    Здесь находится информация,
    которую мы положили в ссылку.
*/

try {

    const encoded =
        params.get("data");


    if (encoded) {

        data =
            JSON.parse(
                decodeURIComponent(
                    escape(
                        atob(encoded)
                    )
                )
            );
    }

} catch (error) {

    console.error(
        "Ошибка чтения подарка:",
        error
    );

}


/* =========================
   ЕСЛИ ДАННЫХ НЕТ
   ========================= */

if (!data) {

    data = {

        name: "тебя",

        message:
            "С днём рождения! ❤️",

        photos: [],

        music: ""

    };

}


/* =========================
   ПЕРЕМЕННЫЕ
   ========================= */

const photos =
    data.photos || [];


let currentPhoto = 0;


const startScreen =
    document.getElementById(
        "startScreen"
    );


const cardScreen =
    document.getElementById(
        "cardScreen"
    );


const giftBox =
    document.getElementById(
        "giftBox"
    );


/* =========================
   ТЕКСТ
   ========================= */

document.title =
    `Подарок для ${data.name}`;


document.getElementById(
    "recipientPreview"
).textContent =
    `Для ${data.name} ❤️`;


document.getElementById(
    "title"
).textContent =
    `С днём рождения, ${data.name}!`;


document.getElementById(
    "message"
).textContent =
    data.message;


/* =========================
   ОТКРЫТИЕ ПОДАРКА
   ========================= */

giftBox.addEventListener(
    "click",
    openGift
);


function openGift() {

    giftBox.classList.add(
        "opened"
    );


    createConfetti();


    setTimeout(() => {

        startScreen.classList.remove(
            "active"
        );


        cardScreen.classList.add(
            "active"
        );


        showPhoto(0);

    }, 900);

}


/* =========================
   ФОТО
   ========================= */

function showPhoto(index) {


    if (!photos.length) {

        document.getElementById(
            "photoArea"
        ).style.display = "none";


        return;
    }


    currentPhoto =
        (index + photos.length)
        % photos.length;


    const image =
        document.getElementById(
            "mainPhoto"
        );


    image.classList.remove(
        "visible"
    );


    setTimeout(() => {

        image.src =
            photos[currentPhoto];


        image.classList.add(
            "visible"
        );

    }, 150);


    renderDots();

}


function renderDots() {

    const dots =
        document.getElementById(
            "photoDots"
        );


    dots.innerHTML = "";


    photos.forEach(
        (_, index) => {

            const dot =
                document.createElement(
                    "span"
                );


            if (
                index === currentPhoto
            ) {

                dot.classList.add(
                    "active"
                );

            }


            dot.onclick = () => {

                showPhoto(index);

            };


            dots.appendChild(
                dot
            );

        }
    );

}


document.getElementById(
    "prevPhoto"
).onclick = () => {

    showPhoto(
        currentPhoto - 1
    );

};


document.getElementById(
    "nextPhoto"
).onclick = () => {

    showPhoto(
        currentPhoto + 1
    );

};


/* =========================
   ОТКРЫТЬ ЕЩЁ РАЗ
   ========================= */

document.getElementById(
    "againButton"
).onclick = () => {

    cardScreen.classList.remove(
        "active"
    );


    startScreen.classList.add(
        "active"
    );


    giftBox.classList.remove(
        "opened"
    );

};


/* =========================
   КОНФЕТТИ
   ========================= */

function createConfetti() {


    const colors = [

        "#ff4d8d",

        "#ffd166",

        "#8be9fd",

        "#c77dff",

        "#ffffff"

    ];


    for (
        let i = 0;
        i < 100;
        i++
    ) {


        const confetti =
            document.createElement(
                "div"
            );


        confetti.className =
            "confetti";


        confetti.style.left =
            Math.random() * 100
            + "vw";


        confetti.style.background =
            colors[
                Math.floor(
                    Math.random()
                    * colors.length
                )
            ];


        confetti.style.animationDuration =
            2 +
            Math.random() * 3
            + "s";


        document.body.appendChild(
            confetti
        );


        setTimeout(() => {

            confetti.remove();

        }, 5000);

    }

}


/* =========================
   МУЗЫКА
   ========================= */

const music =
    document.getElementById(
        "music"
    );


if (data.music) {

    music.src =
        data.music;

}


document.getElementById(
    "musicButton"
).onclick = async () => {


    if (!data.music) {

        alert(
            "Музыка не добавлена."
        );

        return;

    }


    if (music.paused) {

        await music.play();


        document.getElementById(
            "musicButton"
        ).textContent =
            "❚❚ Пауза";

    } else {

        music.pause();


        document.getElementById(
            "musicButton"
        ).textContent =
            "♫ Музыка";

    }

};


</script>


</body>

</html>
