<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Создать подарок 🎁</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="matrix"></div>


<main class="creator">


    <div class="creator-card">


        <div class="creator-logo">
            🎁
        </div>


        <h1>
            Создай подарок
        </h1>


        <p class="creator-subtitle">

            Сделай красивую персональную
            открытку и отправь её ссылкой ❤️

        </p>



        <label>

            Имя получателя

            <input
                id="name"
                type="text"
                maxlength="30"
                placeholder="Например: Аня"
            >

        </label>



        <label>

            Поздравление

            <textarea
                id="message"
                maxlength="500"
                placeholder="Напиши поздравление ❤️"
            ></textarea>

        </label>



        <label>

            Фотографии

            <input
                id="photos"
                type="file"
                accept="image/*"
                multiple
            >

            <small>
                Можно выбрать до 5 фотографий.
            </small>

        </label>



        <div
            id="preview"
            class="preview"
        ></div>



        <button
            id="createButton"
            class="create-button"
            type="button"
        >

            ✨ Создать подарок

        </button>



        <div
            id="result"
            class="result"
        >

            <h2>
                🎉 Подарок готов!
            </h2>


            <p>
                Отправь эту ссылку имениннику:
            </p>


            <input
                id="giftLink"
                type="text"
                readonly
            >


            <button
                id="copyButton"
                type="button"
            >

                📋 Скопировать ссылку

            </button>


            <a
                id="openButton"
                class="open-button"
                target="_blank"
                rel="noopener noreferrer"
            >

                🎁 Открыть подарок

            </a>

        </div>


    </div>


</main>



<script>


const nameInput =
    document.getElementById("name");


const messageInput =
    document.getElementById("message");


const photosInput =
    document.getElementById("photos");


const preview =
    document.getElementById("preview");


const createButton =
    document.getElementById("createButton");


const result =
    document.getElementById("result");


const giftLink =
    document.getElementById("giftLink");


const copyButton =
    document.getElementById("copyButton");


const openButton =
    document.getElementById("openButton");



/*
 * Здесь будут храниться
 * подготовленные фотографии.
 */

let selectedPhotos = [];



/*
 * Выбор фотографий
 */

photosInput.addEventListener(
    "change",
    async function () {


        const files =
            Array.from(
                photosInput.files
            ).slice(0, 5);


        selectedPhotos = [];

        preview.innerHTML = "";


        for (
            const file of files
        ) {


            try {


                const image =
                    await compressImage(
                        file
                    );


                selectedPhotos.push(
                    image
                );


                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    image;


                preview.appendChild(
                    img
                );


            } catch (error) {


                console.error(
                    error
                );

            }

        }

    }
);



/*
 * Сжимаем фотографию.
 */

function compressImage(file) {


    return new Promise(
        (resolve, reject) => {


            const reader =
                new FileReader();


            reader.onload =
                function (event) {


                    const img =
                        new Image();


                    img.onload =
                        function () {


                            const maxWidth =
                                700;


                            let width =
                                img.width;


                            let height =
                                img.height;


                            if (
                                width >
                                maxWidth
                            ) {


                                height =
                                    height *
                                    maxWidth /
                                    width;


                                width =
                                    maxWidth;

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;


                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            const result =
                                canvas.toDataURL(
                                    "image/jpeg",
                                    0.5
                                );


                            resolve(
                                result
                            );

                        };


                    img.onerror =
                        function () {

                            reject(
                                new Error(
                                    "Ошибка открытия фотографии"
                                )
                            );

                        };


                    img.src =
                        event.target.result;

                };


            reader.onerror =
                function () {

                    reject(
                        new Error(
                            "Ошибка чтения фотографии"
                        )
                    );

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}



/*
 * Создание подарка
 */

createButton.addEventListener(
    "click",
    async function () {


        const name =
            nameInput.value.trim();


        const message =
            messageInput.value.trim();


        /*
         * Проверяем имя.
         */

        if (!name) {


            alert(
                "Напиши имя получателя ❤️"
            );


            nameInput.focus();


            return;

        }


        /*
         * Блокируем кнопку.
         */

        createButton.disabled =
            true;


        createButton.textContent =
            "Создаём подарок...";


        try {


            /*
             * Создаём данные подарка.
             */

            const gift = {

                name: name,

                message:
                    message ||
                    "С днём рождения! Желаю тебе счастья, любви и исполнения всех желаний ❤️",

                photos:
                    selectedPhotos,

                music: ""

            };


            /*
             * Превращаем данные
             * в JSON.
             */

            const json =
                JSON.stringify(
                    gift
                );


            /*
             * Кодируем русский текст.
             */

            const encoded =
                btoa(
                    unescape(
                        encodeURIComponent(
                            json
                        )
                    )
                );


            /*
             * Создаём ссылку
             * на наш index.html.
             */

            const longUrl =
                window.location.origin +
                "/?data=" +
                encodeURIComponent(
                    encoded
                );


            console.log(
                "Длинная ссылка:",
                longUrl
            );


            createButton.textContent =
                "Сокращаем ссылку...";


            /*
             * Отправляем длинную ссылку
             * НАШЕМУ VERCEL API.
             */

            const response =
                await fetch(
                    "/api/shorten",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                url:
                                    longUrl

                            })

                    }
                );


            const data =
                await response.json();


            /*
             * Проверяем ответ.
             */

            if (
                !response.ok ||
                !data.shorturl
            ) {


                throw new Error(
                    data.error ||
                    "Не удалось сократить ссылку"
                );

            }


            /*
             * Получили короткую ссылку.
             */

            const shortUrl =
                data.shorturl;


            giftLink.value =
                shortUrl;


            openButton.href =
                shortUrl;


            result.classList.add(
                "visible"
            );


            result.scrollIntoView({

                behavior:
                    "smooth",

                block:
                    "center"

            });


            createButton.textContent =
                "✓ Подарок создан";


        } catch (error) {


            console.error(
                error
            );


            alert(
                "Не удалось создать ссылку.\n\n" +
                error.message
            );


            createButton.disabled =
                false;


            createButton.textContent =
                "✨ Создать подарок";

        }

    }
);



/*
 * Копирование ссылки.
 */

copyButton.addEventListener(
    "click",
    async function () {


        try {


            await navigator.clipboard.writeText(
                giftLink.value
            );


            copyButton.textContent =
                "✓ Скопировано!";


        } catch (error) {


            giftLink.select();


            document.execCommand(
                "copy"
            );


            copyButton.textContent =
                "✓ Скопировано!";

        }


        setTimeout(
            function () {

                copyButton.textContent =
                    "📋 Скопировать ссылку";

            },
            2000
        );

    }
);


</script>

</body>

</html>
